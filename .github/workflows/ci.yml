name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Linux release is built with, 3.14 the Windows one.
        include:
          - os: ubuntu-22.04
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        # PySide6 needs these to import at all, even with the offscreen platform.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        # Only the rules that catch real bugs: undefined names, a function
        # defined twice, syntax errors. The codebase is not ready for more.
        run: python -m ruff check src tests --select E9,F63,F7,F82,F811

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
